name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck source
        run: npm run lint
      - name: Typecheck tests
        run: npm run lint:tests
      - name: Build
        run: npm run build
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium
      - name: Test
        # Real Chromium/ffmpeg/subprocess suites share the runner; single-worker keeps
        # campaign timing deterministic (parallel runs produced host-dependent flake).
        run: npm test -- --maxWorkers=1
      - name: First-use judge route (Linux)
        if: runner.os == 'Linux'
        # Proves the documented TESTING.md route on a clean CI runner.
        run: node examples/first-use/run.mjs /tmp/praman-first-use-ci
